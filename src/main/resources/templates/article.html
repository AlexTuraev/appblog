<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog's articles</title>
    <style>
        html * {
            margin: 0;
            padding: 0;
            color: black;
        }
        ul, li{
            list-style: none;
        }
        body{
            width: 1200px;
            margin: 0 auto 0;
        }
        .section{
        }
        .article{
            width: 1200px;
            padding: 10px 0 15px;
            overflow: hidden;
        }
        .article__title{
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }
        .article__div-img{
            display: flex;
            flex-direction: row;
            justify-content: center;
            height: 150px;
            margin-bottom: 15px;
        }
        .article__div-img__img{
            width: 400px;
            height: 100%;
            border: black dotted 1px;
        }
        .article__content{
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .article__footer{
            margin-top: 10px;
            display: flex;
        }
        .article__actions-div{
            display: flex;
        }
        .artile__comments{
            margin-top: 25px;
            max-height: 300px;
            overflow: auto;
        }
        .article__single-comment{
            margin: 20px auto 15px;
        }
        .btn{
            font-size: 20px;
            padding: 5px 30px;
            border-radius: 10px;
        }
        .btn:hover{
            background: aquamarine;
        }
        .a-main{
            float: right;
            color: blue;
        }
        .a-main:hover{
            font-weight: bold;
        }
    </style>
</head>

<body>
    <p>
        <a th:href="@{/blog}">
            <span class="a-main">НА ГЛАВНУЮ &cudarrr;</span>
        </a>
    </p>
    <header class="header">Страница поста</header>
    <section class="section" id="main-section">
        <article class=" article">
            <div class="article__title" th:text="${post.title}"/>

            <div class="article__div-img">
                <img class="article__div-img__img" th:src="${post.base64Image}" alt="some picture">
            </div>

            <div class="article__content">
                <span th:text="${post.content}"></span>
            </div>

            <div class="article__footer">
                <form th:action="@{/blog/{id}/like(id=${post.id})}" method="post">
                    <button name="like" value="true">&#x1F44D;</button>
                    <span th:text="${post.countLike}"></span>
                    <button name="like" value="false">&#128078;</button>
                </form>
            </div>
        </article>

        <div class="article__actions-div">
            <form th:action="@{/blog/{id}(id=${post.id})}" method="post">
                <input type="hidden" name="_method" value="delete">
                <button class="btn" type="submit">Удалить пост</button>
            </form>

            <form th:action="@{/blog/comment}" method="post">
                <input type="hidden" name="postId" th:value="${post.id}" >
                <input name="content">
                <button class="btn" type="submit">Добавить комментарий</button>
            </form>
        </div>

        <div class="artile__comments">
            <h3>Комментарии:</h3>
            <ul>
                <li th:each="comment : ${comments}">
                    <div class="article__single-comment">
                        <span>Комментарий id:</span><span th:text="${comment.id}"></span><br>
                        <span th:text="${comment.content}"></span>
                    </div>
                </li>
            </ul>
        </div>

    </section>
</body>

</html>
