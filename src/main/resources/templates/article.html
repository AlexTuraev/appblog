<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog's articles</title>
    <style>
        html * {
            margin: 0;
            padding: 0;
            color: black;
        }
        body{
            width: 1200px;
            margin: 0 auto 0;
        }
        .section{
            border: chocolate dashed 1px;
        }
        .article{
            width: 1200px;
            padding: 10px 0 15px;
            overflow: hidden;
        }
        .article__title{
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }
        .article__div-img{
            display: flex;
            flex-direction: row;
            justify-content: center;
            height: 150px;
            margin-bottom: 15px;
            border: chocolate dotted 1px;
        }
        .article__div-img__img{
            width: 400px;
            height: 100%;
            border: black dotted 1px;
        }
        .article__content{
            width: 100%;
            height: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .article__footer{
            margin-top: 10px;
            display: flex;
        }
    </style>
</head>

<body>
    <header class="header">Страница поста</header>
    <section class="section" id="main-section">
        <article class=" article">
            <div class="article__title" th:text="${post.title}"/>

            <div class="article__div-img">
                <img class="article__div-img__img" th:src="${post.base64Image}" alt="some picture">
            </div>

            <div class="article__content">
                <span th:text="${post.content}"></span>
            </div>

            <div class="article__footer">
                <span th:text="${post.countLike}"> лайков</span>
                <span th:text="${post.countLike}"></span>
            </div>
        </article>
    </section>
</body>

</html>
