<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogpage</title>
<!--    <link rel="stylesheet" th:href="@{static/styles/blogpage.css}" />-->
    <style>
        html{
            margin: 0;
        }
        body{
            width: 1200px;
            margin: 0 auto 0;
        }
        .header{
            margin-top: 10px;
            font-size: 40px;
            text-align: center;
        }
        ul, li{
            list-style: none;
        }
    </style>
</head>

<body>
    <header class="header">Blog page</header>
    <section>
        <ul>
            <li th:each="post : ${posts}">
                <article>
                    <h1 th:text="${post.title}"/>
                </article>
            </li>
        </ul>
        <article>

        </article>
    </section>

</body>

</html>
