<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog's articles</title>
<!--    <link rel="stylesheet" th:href="@{static/styles/blogpage.css}" />-->
    <style>
        html *{
            margin: 0;
            padding: 0;
        }
        body{
            width: 1200px;
            margin: 0 auto 0;
        }
        .header{
            margin: 0 auto 20px;
            font-size: 40px;
            text-align: center;
        }
        .section{
            border: chocolate dashed 1px;
        }
        ul, li{
            list-style: none;
        }
        .article{
            width: 1200px;
            padding: 10px 0 15px;
        }
        .article__title{
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }
        .article__div-img{
            display: flex;
            flex-direction: row;
            justify-content: center;
            height: 150px;
            margin-bottom: 15px;
            border: chocolate dotted 1px;
        }
        .article__div-img__img{
            width: 400px;
            height: 100%;
            border: black dotted 1px;
        }
        .article__content{
            width: 100%;
            height: 50px;
        }
        .article__footer{
            display: flex;
        }
        .form-wrapper{
            display: flex;
            flex-direction: column;
            width: 800px;
            border: black solid 2px;
            text-align: center;
        }
        .form-wrapper__title{
            font: bold 25px Arial, sans-serif;
        }
        .form-wrapper__element{
            margin: 10px auto 30px;
        }
        .form-wrapper__element__input,
        .form-wrapper__element__input:active,
        .form-wrapper__element__input:focus
        {
            font-size: 20px;
            width: 80%;
            outline: 0;
            border: none;
            border-bottom: 1px solid black;
        }
        .btn{
            font-size: 20px;
            padding: 5px 30px;
            border-radius: 10px;
        }
        .btn:hover{
            background: aquamarine;
        }
    </style>
</head>

<body>
    <header class="header">Blog page</header>
    <section class="section">
        <button class="btn" onclick="toggleForm()">Добавить статью в блог</button>
        <ul>
            <li th:each="post : ${posts}">
                <article class=" article">
                    <div class="article__title" th:text="${post.title}"/>
                    <div class="article__div-img">
                        <img class="article__div-img__img" src="" alt="some picture">
                    </div>

                    <div class="article__content">
                        <span th:text="${post.content}"></span>
                    </div>

                    <div class="article__footer">
                        <span th:text="${post.countLike}"> лайков</span>
                        <span th:text="${post.countLike}"></span>
                    </div>
                </article>
            </li>
        </ul>
    </section>
    <div class="form-wrapper" id="addPostForm">
        <header class="form-wrapper__element">
            <span class="form-wrapper__title">Добавить статью в блог</span>
        </header>
        <form th:action="@{/post}" method="post">
            <div class="form-wrapper__element">
                <label for="title">Название поста:</label><br>
                <input class="form-wrapper__element__input" type="text" id="title" name="title" required>
            </div>

            <div class="form-wrapper__element">
                <label for="content">Текст поста:</label><br>
                <input class="form-wrapper__element__input" type="text" id="content" name="content" required>
            </div>

            <div class="form-wrapper__element">
                <label for="tag">Теги поста:</label><br>
                <input class="form-wrapper__element__input" type="text" id="tag" name="tag" required>
            </div>

            <div class="form-wrapper__element">
                <label for="image">Картинка:</label>
                <input type="file" id="image" name="image">
            </div>

            <button class="form-wrapper__element btn" type="submit">Добавить</button>
        </form>
    </div>

    <script>
        function toggleForm() {
            const form = document.getElementById('addPostForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }
    </script>

</body>

</html>
