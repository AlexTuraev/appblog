<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog's articles</title>
<!--    <link rel="stylesheet" th:href="@{static/styles/blogpage.css}" />-->
    <style>
        html *{
            margin: 0;
            padding: 0;
        }
        body{
            width: 1200px;
            margin: 0 auto 0;
        }
        .header{
            margin: 0 auto 20px;
            font-size: 40px;
            text-align: center;
        }
        .section{
            border: chocolate dashed 1px;
        }
        ul, li{
            list-style: none;
        }
        .article{
            width: 1200px;
            padding: 10px 0 15px;
        }
        .article__title{
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }
        .article__div-img{
            display: flex;
            flex-direction: row;
            justify-content: center;
            height: 150px;
            margin-bottom: 15px;
            border: chocolate dotted 1px;
        }
        .article__div-img__img{
            width: 400px;
            height: 100%;
            border: black dotted 1px;
        }
        .article__content{
            width: 100%;
            height: 50px;
        }
        .article__footer{
            display: flex;
        }
    </style>
</head>

<body>
    <header class="header">Blog page</header>
    <section class="section">
        <ul>
            <li th:each="post : ${posts}">
                <article class=" article">
                    <div class="article__title" th:text="${post.title}"/>
                    <div class="article__div-img">
                        <img class="article__div-img__img" src="" alt="some picture">
                    </div>

                    <div class="article__content">
                        <span th:text="${post.content}"></span>
                    </div>

                    <div class="article__footer">
                        <span th:text="${post.countLike}"> лайков</span>
                        <span th:text="${post.countLike}"></span>
                    </div>
                </article>
            </li>
        </ul>
        <article>

        </article>
    </section>

</body>

</html>
